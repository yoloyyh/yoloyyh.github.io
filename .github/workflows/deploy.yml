name: Refresh projects and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test repository classification
        run: node --test tests/*.test.*
      - name: Refresh GitHub project data
        run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - name: Exclude local-only knowledge preview
        run: rm -f articles-preview.js articles-preview.js.tmp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
